<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="top">
    <header>
      <span class="dot" id="dot"></span>
      <span id="recText">__MSG_stateIdle__</span>
      <span id="extVer"></span>
      <button id="btnToggle" class="primary">__MSG_btnStart__</button>
      <button id="btnOpenMgr" title="__MSG_panelSubmitTitle__">__MSG_panelSubmit__</button>
      <div id="captureBar" class="capture-bar"></div>
    </header>

    <div class="sessions-head"><b>__MSG_sessionsHead__</b><span class="m" id="sessCount">__MSG_loading__</span><span class="m" id="sessHint">__MSG_sessHint__</span></div>
    <div id="sessionList"><div class="empty">__MSG_sessionsLoading__</div></div>
  </div>

  <div class="range-bar">
    <label class="chk"><input id="rangeMode" type="checkbox" /> __MSG_rangePick__</label>
    <span id="rangeInfo">__MSG_rangeHint__</span>
    <span class="m" id="selSummary"></span>
    <button id="btnClearRange" class="ghost" hidden>__MSG_rangeClear__</button>
    <button id="btnSubmitRange" class="primary" hidden>__MSG_rangeSubmit__</button>
  </div>

  <div id="timeline"></div>

  <div class="pages-head">
    <b>__MSG_stepsHead__</b>
    <select id="listOrigin" title="__MSG_originTitle__">
      <option value="all">__MSG_originAll__</option>
      <option value="human">__MSG_originHuman__</option>
      <option value="event">__MSG_originEvent__</option>
    </select>
    <select id="pageSort" title="__MSG_sortTitlePanel__">
      <option value="asc">__MSG_sortAscTime__</option>
      <option value="desc">__MSG_sortDescTime__</option>
    </select>
    <span class="view-filters" id="viewFilters">
      <label class="chk"><input type="checkbox" data-view="isClickShown" checked /> __MSG_filterClick__</label>
      <label class="chk"><input type="checkbox" data-view="isKeyboardShown" checked /> __MSG_filterKey__</label>
      <label class="chk"><input type="checkbox" data-view="isShotShown" checked /> __MSG_filterShot__</label>
      <label class="chk"><input type="checkbox" data-view="isVueShown" checked /> Vue</label>
      <label class="chk"><input type="checkbox" data-view="isConsoleShown" checked /> Console</label>
      <label class="chk"><input type="checkbox" data-view="isRequestShown" checked /> __MSG_filterRequest__</label>
    </span>
    <span class="pager">
      <button id="pgPrev">‹</button>
      <span id="pgInfo">1 / 1</span>
      <button id="pgNext">›</button>
    </span>
  </div>
  <div id="pages"></div>

  <script src="panel.js"></script>
</body>
</html>

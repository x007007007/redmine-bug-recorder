name: package

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(node -p "require('./manifest.json').version")
          ff=$(node -p "require('./manifest.firefox.json').version")
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          test "$ver" = "$ff" && test "$ver" = "$pkg" && test "$ver" = "$tag"

      - run: sudo apt-get update && sudo apt-get install -y zip unzip
      - run: npm run release
      - run: npm run source-zip

      - uses: actions/upload-artifact@v4
        with:
          name: bug-recorder-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      # 正式版本页在 GitLab Release。这里的 GitHub Release 只给内网 GitLab 拉取安装包。
      - name: 上传安装包到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="安装包由 GitHub Actions 构建。正式版本发布在 GitLab Release。不可商用，商业使用需先联系作者取得书面授权。"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes "$notes"
          fi

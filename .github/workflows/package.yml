name: package

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(node -p "require('./manifest.json').version")
          ff=$(node -p "require('./manifest.firefox.json').version")
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          test "$ver" = "$ff" && test "$ver" = "$pkg" && test "$ver" = "$tag"

      - run: npm run release
      - run: npm run source-zip

      - uses: actions/upload-artifact@v4
        with:
          name: bug-recorder-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 按 manifest 版本创建 tag
        id: version_tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "require('./manifest.json').version")
          ff=$(node -p "require('./manifest.firefox.json').version")
          pkg=$(node -p "require('./package.json').version")
          test "$ver" = "$ff" && test "$ver" = "$pkg"
          tag="v${ver}"
          set +e
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '[.object.type, .object.sha] | @tsv' 2>/tmp/tag-err.txt)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if ! grep -Eq 'HTTP 404|Not Found' /tmp/tag-err.txt; then
              cat /tmp/tag-err.txt
              exit 1
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$GITHUB_SHA"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "已创建 ${tag}"
            exit 0
          fi
          type=${meta%%$'\t'*}
          sha=${meta#*$'\t'}
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)
          fi
          if [ "$sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${tag} 已指向本次提交"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${tag} 已指向 ${sha}，已发布的 tag 不移动。要发新版本请先递增 manifest 版本号。"
          fi

      - name: 上传安装包到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || steps.version_tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="安装包由 GitHub Actions 构建。不可商用，商业使用需先联系作者取得书面授权。"
          gh release delete "$GITHUB_REF_NAME" --yes > /tmp/gh-delete.txt 2>&1 || true
          if ! gh release create "$GITHUB_REF_NAME" release/* \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --latest > /tmp/gh-create.txt 2>&1; then
            {
              echo '## gh release create 失败'
              echo '```'
              cat /tmp/gh-delete.txt /tmp/gh-create.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/gh-create.txt >> "$GITHUB_STEP_SUMMARY"
          code=$(curl -sS -o /tmp/public-release.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: redmine-bug-recorder" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          {
            echo "public_release_http=${code}"
            jq -r '[.tag_name, (.assets // [] | map(.name) | join(","))] | @tsv' /tmp/public-release.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"

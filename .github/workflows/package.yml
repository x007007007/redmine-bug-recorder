name: package

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(node -p "require('./manifest.json').version")
          ff=$(node -p "require('./manifest.firefox.json').version")
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          test "$ver" = "$ff" && test "$ver" = "$pkg" && test "$ver" = "$tag"

      - run: npm run release
      - run: npm run source-zip

      - uses: actions/upload-artifact@v4
        with:
          name: bug-recorder-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: 上传安装包到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="安装包由 GitHub Actions 构建。不可商用，商业使用需先联系作者取得书面授权。"
          gh release delete "$GITHUB_REF_NAME" --yes > /tmp/gh-delete.txt 2>&1 || true
          if ! gh release create "$GITHUB_REF_NAME" release/* \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --latest > /tmp/gh-create.txt 2>&1; then
            {
              echo '## gh release create 失败'
              echo '```'
              cat /tmp/gh-delete.txt /tmp/gh-create.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/gh-create.txt >> "$GITHUB_STEP_SUMMARY"
          code=$(curl -sS -o /tmp/public-release.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: redmine-bug-recorder" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          {
            echo "public_release_http=${code}"
            jq -r '[.tag_name, (.assets // [] | map(.name) | join(","))] | @tsv' /tmp/public-release.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"

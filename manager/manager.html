<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bug Recorder for Redmine</title>
  <link rel="stylesheet" href="manager.css" />
</head>
<body data-dock-side="right" data-dock-collapsed="1">
  <header>
    <h1>🐞 Bug Recorder <small>for Redmine</small> <span id="extVer"></span></h1>
    <span class="chip" id="recChip"><span class="dot" id="dot"></span><span id="recText">__MSG_stateIdle__</span></span>
    <button id="btnToggleRec" class="primary">__MSG_btnStart__</button>
    <div id="captureBar" class="capture-bar"></div>
    <span id="err" class="err" hidden></span>
  </header>

  <details id="settingsBox">
    <summary>__MSG_settingsSummary__</summary>
    <div class="settings-grid">
      <label>__MSG_labelUrl__
        <input id="setUrl" placeholder="__MSG_phUrl__" />
      </label>
      <label>__MSG_labelKey__
        <input id="setKey" type="password" placeholder="__MSG_phKey__" />
      </label>
      <label class="chk">
        <input id="setBodies" type="checkbox" />
        __MSG_labelBodies__
      </label>
      <div class="row">
        <button id="btnSaveSettings">__MSG_btnSaveSettings__</button>
        <button id="btnTest">__MSG_btnTest__</button>
        <span id="testResult"></span>
      </div>
    </div>
  </details>

  <main id="workspace">
    <aside id="sessionAside">
      <div class="aside-head">
        <h2>__MSG_sessionsHead__</h2>
        <button id="btnRefresh" class="ghost" title="__MSG_btnRefreshTitle__">⟳</button>
      </div>
      <div id="sessions"></div>
    </aside>

    <section id="detail">
      <div id="noSession" class="empty">__MSG_emptySession__</div>

      <div id="sessionDetail" hidden>
        <div class="detail-head">
          <h2 id="detailTitle">__MSG_sessionWord__</h2>
          <button id="btnExport" class="ghost">__MSG_btnExport__</button>
        </div>
        <div class="meta" id="detailMeta"></div>
        <div class="meta" id="scopeInfo"></div>
        <div id="issueHistory" class="issue-history" hidden></div>

        <h3>__MSG_timelineTitle__</h3>
        <div class="row wrap steps-toolbar">
          <label class="chk"><input id="selAll" type="checkbox" checked /> __MSG_selAll__</label>
          <span class="count" id="selInfo"></span>
          <input id="searchBox" placeholder="__MSG_phSearch__" />
          <select id="listOrigin" title="__MSG_originTitle__">
            <option value="all">__MSG_originAll__</option>
            <option value="human">__MSG_originHuman__</option>
            <option value="event">__MSG_originEvent__</option>
          </select>
          <select id="sortMode" title="__MSG_sortTitle__">
            <option value="desc">__MSG_sortDesc__</option>
            <option value="asc">__MSG_sortAsc__</option>
          </select>
          <button type="button" id="btnCollapseAll" class="ghost">__MSG_btnCollapse__</button>
          <span class="view-filters" id="viewFilters">
            <label class="chk"><input type="checkbox" data-view="isClickShown" checked /> __MSG_filterClick__</label>
            <label class="chk"><input type="checkbox" data-view="isKeyboardShown" checked /> __MSG_filterKey__</label>
            <label class="chk"><input type="checkbox" data-view="isShotShown" checked /> __MSG_filterShot__</label>
            <label class="chk"><input type="checkbox" data-view="isVueShown" checked /> Vue</label>
            <label class="chk"><input type="checkbox" data-view="isConsoleShown" checked /> Console</label>
            <label class="chk"><input type="checkbox" data-view="isRequestShown" checked /> __MSG_filterRequest__</label>
          </span>
        </div>
        <div id="steps"></div>
      </div>
    </section>

    <aside id="submitDock" hidden>
      <div class="dock-rail">
        <button type="button" id="btnDockExpand" title="__MSG_dockExpandTitle__">__MSG_submitBug__</button>
        <button type="button" id="btnDockSideRail" class="ghost" title="__MSG_dockSideTitle__">⇄</button>
      </div>
      <div class="dock-body">
    <div class="dock-head">
      <b>__MSG_submitBug__</b>
      <span id="dockSel"></span>
      <button type="button" id="btnDockSide" class="ghost" title="__MSG_dockSideTitle__">⇄</button>
      <button type="button" id="btnDockCollapse" class="ghost">__MSG_dockCollapse__</button>
      <button type="button" id="btnRegen">__MSG_btnRegen__</button>
    </div>
    <form id="bugForm">
      <label>__MSG_labelSubject__
        <input id="bugSubject" required placeholder="__MSG_phSubject__" />
      </label>
      <div class="row wrap">
        <label>__MSG_labelProject__
          <span class="inline"><select id="bugProject"></select><button type="button" id="btnLoadProjects" class="ghost">__MSG_btnLoad__</button></span>
        </label>
        <label>__MSG_labelTracker__
          <select id="bugTracker"><option value="">__MSG_optDefault__</option></select>
        </label>
        <label>__MSG_labelPriority__
          <select id="bugPriority"><option value="">__MSG_optDefault__</option></select>
        </label>
        <label>__MSG_labelProjectManual__
          <input id="bugProjectManual" placeholder="__MSG_phProject__" />
        </label>
      </div>
      <label>__MSG_labelDescription__
        <textarea id="bugDescription" rows="8" spellcheck="false"></textarea>
      </label>
      <div class="row wrap">
        <label class="chk"><input id="bugAttach" type="checkbox" checked /> __MSG_chkShots__</label>
        <label class="chk"><input id="bugAttachCsv" type="checkbox" /> __MSG_chkCsv__</label>
        <label>__MSG_labelShotMax__
          <span class="inline"><input id="bugShotMax" type="number" value="20" min="0" style="width:64px" /> __MSG_shotUnit__</span>
        </label>
        <button type="button" id="btnCopyDesc">__MSG_btnCopy__</button>
        <button type="button" id="btnExportCsv">__MSG_btnExportCsv__</button>
        <button type="submit" id="btnSubmit" class="primary">__MSG_btnSubmit__</button>
      </div>
      <div id="updateHint" hidden></div>
      <div id="submitResult"></div>
    </form>
      </div>
    </aside>
  </main>

  <div id="lightbox" hidden>
    <div class="lightbox-inner">
      <img id="lightboxImg" alt="__MSG_shotAlt__" />
      <span id="lightboxMarker" class="shot-marker big" hidden></span>
    </div>
  </div>
  <script src="manager.js" type="module"></script>
</body>
</html>

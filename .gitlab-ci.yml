# 只在 git tag vX.Y.Z 上发布。打包由 GitHub Actions 完成,这里把安装包放进 GitLab Release。
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - release

publish:
  stage: release
  image: alpine:3.20
  tags: [docker]
  timeout: 20m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache curl jq ca-certificates
  script:
    - sh tools/publish-gitlab-release.sh

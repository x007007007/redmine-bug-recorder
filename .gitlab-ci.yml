# 只在 git tag vX.Y.Z 上发布。GitHub Actions 打公开包;这里用同一 tag 再构建一次并写入 GitLab Release。
# 内网 Runner 连不上 GitHub Release 的附件 CDN,也不在镜像里装 apt 包。
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - release

publish:
  stage: release
  image: node:22-bookworm-slim
  tags: [docker]
  timeout: 30m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - npm ci
    - npm run release
    - npm run source-zip
    - node tools/publish-gitlab-release.mjs
